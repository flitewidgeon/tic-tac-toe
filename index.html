<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" type="text/css" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <dialog>
    <form action="#">
      <p>
        <label for="player-one">Player One Name:</label>
        <input type="text" id="player-one">
      </p>
      <p>
        <label for="player-two">Player Two Name: </label>
        <input type="text" id="player-two">
      </p>
    </form>
    <button id="close-button">Close</button>
    <button id="submit-button">Submit</button>
  </dialog>
  <div class="grid-container">
    <div class="cell border-bottom" id="0"></div>
    <div class="cell border-bottom border-left" id="1"></div>
    <div class="cell border-bottom border-left" id="2"></div>
    <div class="cell border-bottom" id="3"></div>
    <div class="cell border-bottom border-left" id="4"></div>
    <div class="cell border-bottom border-left" id="5"></div>
    <div class="cell" id="6"></div>
    <div class="cell border-left" id="7"></div>
    <div class="cell border-left" id="8"></div>
  </div>
  <button id="new-game">New Game</button>
</body>

</html>
